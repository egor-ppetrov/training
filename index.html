<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101b16" />
  <meta name="description" content="Персональный план тренировок и питания" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icon-192.svg" />
  <link rel="stylesheet" href="styles.css" />
  <title>Форма — твой план</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div><p class="eyebrow">ТВОЙ ФИТНЕС-ПЛАН</p><h1>Форма</h1></div>
      <button id="notifyBtn" class="icon-button" aria-label="Напоминания">🔔</button>
    </header>

    <section id="workoutView" class="view active"></section>
    <section id="foodView" class="view"></section>
    <section id="progressView" class="view"></section>

    <nav class="bottom-nav" aria-label="Навигация">
      <button class="nav-item active" data-view="workoutView"><span>⌁</span>Тренировка</button>
      <button class="nav-item" data-view="foodView"><span>◉</span>Питание</button>
      <button class="nav-item" data-view="progressView"><span>↗</span>Прогресс</button>
    </nav>
  </main>
  <dialog id="exerciseModal" class="exercise-modal"></dialog>
  <dialog id="reminderModal" class="exercise-modal"></dialog>
  <script src="app.js"></script>
</body>
</html>
